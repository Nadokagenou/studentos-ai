<!doctype html><html lang="th"><meta charset="utf-8"><title>StudentOS · ตรวจธีมผีไทย</title><style>body{margin:0;background:#080d19;color:#e8dec8;font:15px/1.6 system-ui}main{display:flex;justify-content:center;gap:24px;padding:18px}aside{width:310px}button,select{font:inherit;padding:8px;background:#1d2637;color:inherit;border:1px solid #9e895f;border-radius:8px;margin:4px}pre{font-size:11px;white-space:pre-wrap}#shell{width:281.25px;height:609px}iframe{width:375px;height:812px;border:0;transform:scale(.75);transform-origin:top left;border-radius:24px}</style>
<main><aside><h1>เรือนลับแล · ตัวอย่าง</h1><p>ข้อมูลจำลองแยกจากบัญชีจริง</p><select id="size"><option value="375,812">375 × 812</option><option value="320,568">320 × 568</option><option value="812,375">812 × 375</option><option value="1280,900">1280 × 900</option></select><button id="measure">วัดการจัดวาง</button><pre id="report"></pre></aside><div id="shell"><iframe id="app" src="../../?halloween-showroom=1&amp;thai-ghost-preview=1"></iframe></div></main>
<script>const f=document.getElementById('app'),out=document.getElementById('report');function measure(){const d=f.contentDocument,s=d.querySelector('.screen.on'),body=d.querySelector('#menuBody');out.textContent=JSON.stringify({theme:d.documentElement.dataset.theme,viewport:[f.offsetWidth,f.offsetHeight],overflow:d.documentElement.scrollWidth>f.offsetWidth,menuScroll:s.scrollHeight-s.clientHeight,children:[...body.children].filter(x=>getComputedStyle(x).display!=='none').map(x=>({class:x.className,height:Math.round(x.getBoundingClientRect().height),top:Math.round(x.getBoundingClientRect().top)}))},null,2);}f.onload=()=>setTimeout(measure,1200);document.getElementById('measure').onclick=measure;document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',').map(Number),scale=w>600?.65:.75;Object.assign(f.style,{width:w+'px',height:h+'px',transform:'scale('+scale+')'});Object.assign(document.getElementById('shell').style,{width:w*scale+'px',height:h*scale+'px'});setTimeout(measure,100);};</script></html>
