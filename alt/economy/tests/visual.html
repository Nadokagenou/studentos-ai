<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudentOS · ตรวจฉากฉลองโดยไม่ใช้บัญชี</title>
<link rel="stylesheet" href="../../halloween/season/cursed-ship.css"><link rel="stylesheet" href="../../halloween/season/biome-finishes.css?rev=unique-20261026"><link rel="stylesheet" href="../../halloween/season/cinematic-variants.css"><link rel="stylesheet" href="../client.css">
<style>*{box-sizing:border-box}body{margin:0;background:#080d19;color:#eee6d5;font:16px/1.6 system-ui}main{display:flex;gap:30px;justify-content:center;padding:20px}aside{max-width:310px}button,select{font:inherit;padding:10px;margin:4px;border:1px solid #ae9763;border-radius:10px;background:#1e2532;color:inherit}.phone{position:relative;width:375px;height:812px;flex:none;overflow:hidden;border:1px solid #635943;border-radius:24px;background:linear-gradient(#20273b,#080d19);display:grid;place-items:center}.phone h2{font-size:23px;text-align:center;padding:20px}.cs-art{background-repeat:no-repeat}output{display:block;overflow-wrap:anywhere;margin:16px 0}.pass{color:#a9dbbc}.fail{color:#f9b7ae}@media(max-width:760px){main{display:block}.phone{max-width:100%;margin:auto}aside{margin:auto}}</style>
<main><aside><h1>ฉากฉลอง Halloween</h1><p>ตัวอย่างในเครื่อง · ไม่มีบัญชีจริงหรือการแจกของ</p><label>รูปแบบ <select id="variant"></select></label><button id="play">ดูฉากเต็ม</button><button id="all">ตรวจทั้ง 8 แบบ</button><button id="still">ตรวจภาพนิ่ง</button><button id="checkpoint">ตรวจแสงโฟกัส</button><output id="status" role="status">พร้อมตรวจ</output><label>ขนาด <select id="size"><option value="375,812">375 × 812</option><option value="320,568">320 × 568</option><option value="812,375">812 × 375</option><option value="1024,768">1024 × 768</option></select></label></aside><div class="phone"><h2>เสร็จแล้ว<br>แบบฝึกหัดคณิตศาสตร์</h2></div></main>
<script>window.__HW_SHOWROOM__=true;window.FX_SHOP={};window.renderFxPick=()=>{};let reduced=false;window.matchMedia=q=>({matches:q.includes('reduced-motion')&&reduced,addEventListener(){},removeEventListener(){}});</script>
<script src="../../halloween/rewards/catalog.js"></script><script src="../../halloween/season/biome-finishes.js?rev=unique-20261026"></script><script src="../../halloween/season/cursed-ship.js"></script><script src="../focus-checkpoints.js"></script>
<script>
const variants=StudentOSHalloweenRewards.items.filter(x=>x.kind==='effect'),status=document.getElementById('status'),pick=document.getElementById('variant');
pick.innerHTML=variants.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('');
function play(item,still=false){reduced=still;document.documentElement.dataset.csPreviewMotion=still?'':'full';return new Promise(resolve=>{let calls=0;const start=performance.now();CursedShip.playVariant(item,()=>{calls++;setTimeout(()=>resolve({id:item.id,calls,elapsed:Math.round(performance.now()-start),leaked:document.querySelectorAll('.cs-ov').length}),40);},'แบบฝึกหัดคณิตศาสตร์ ข้อ 1–10',true);});}
document.getElementById('play').onclick=async()=>{const r=await play(StudentOSHalloweenRewards.find(pick.value));status.textContent=JSON.stringify(r);};
document.getElementById('still').onclick=async()=>{const r=await play(StudentOSHalloweenRewards.find(pick.value),true);status.textContent=JSON.stringify(r);};
document.getElementById('all').onclick=async()=>{const controls=[...document.querySelectorAll('button,select')];controls.forEach(x=>x.disabled=true);try{const rows=[];for(const item of variants){status.textContent='กำลังตรวจ '+item.name;rows.push(await play(item));}const pass=rows.every(x=>x.calls===1&&x.leaked===0&&x.elapsed>=5900);status.className=pass?'pass':'fail';status.dataset.result=pass?'passed':'failed';status.textContent=(pass?'ผ่าน 8/8':'พบข้อผิดพลาด')+' · callback ครั้งเดียว · เก็บฉากครบ\n'+JSON.stringify(rows);}finally{controls.forEach(x=>x.disabled=false);}};
document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',');Object.assign(document.querySelector('.phone').style,{width:w+'px',height:h+'px'});};
document.getElementById('checkpoint').onclick=()=>FocusCheckpoints.show({id:'fixture',question:'แสงเทียน 12 ดวง เพิ่มอีก 7 ดวง รวมกี่ดวง?',options:[18,19,20,21]},async(_id,answer)=>answer===1);
</script></html>
