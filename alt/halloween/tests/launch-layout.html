<!doctype html><html lang="th"><meta charset="utf-8"><title>StudentOS · ตรวจอีเวนต์ก่อนเปิด</title>
<style>body{margin:0;background:#080b16;color:#eee6d6;font:15px/1.6 system-ui}main{display:flex;justify-content:center;gap:24px;padding:18px}aside{width:300px}button,select{font:inherit;padding:8px;margin:4px;background:#1c2636;color:inherit;border:1px solid #8d7a5b;border-radius:8px}pre{white-space:pre-wrap;font-size:12px}#shell{width:300px;height:650px}iframe{width:375px;height:812px;border:0;transform:scale(.8);transform-origin:top left}</style>
<main><aside><h1>ตรวจอีเวนต์ก่อนเปิด</h1><p>ห้องลอง · ไม่ต่อบัญชีจริง</p><label>ขนาดจอ <select id="size"><option value="375,812">375 × 812</option><option value="320,568">320 × 568</option><option value="812,375">812 × 375</option><option value="1024,768">1024 × 768</option></select></label><button id="measure">ตรวจหน้าปัจจุบัน</button><pre id="report"></pre></aside><div id="shell"><iframe id="event" title="ตรวจเส้นทางเล่นอีเวนต์" src="../event/?preview=1&amp;qa=layout-20261027"></iframe></div></main>
<script>
const frame=document.getElementById('event'),report=document.getElementById('report');
function measure(){const d=frame.contentDocument,dialog=d.querySelector('dialog[open]'),r=dialog?.getBoundingClientRect();report.textContent=JSON.stringify({viewport:[frame.offsetWidth,frame.offsetHeight],route:frame.contentWindow.location.hash,overflow:d.documentElement.scrollWidth>d.documentElement.clientWidth,dialog:r?{width:Math.round(r.width),height:Math.round(r.height),inViewport:r.left>=0&&r.right<=frame.offsetWidth+1&&r.top>=0&&r.bottom<=frame.offsetHeight+1}:null,brokenImages:[...d.images].filter(x=>x.getAttribute('src')&&x.complete&&x.naturalWidth===0).map(x=>x.getAttribute('src'))},null,2);}
document.getElementById('measure').onclick=measure;
document.getElementById('size').onchange=e=>{const [w,h]=e.target.value.split(',').map(Number),scale=w>600?.65:.8;Object.assign(frame.style,{width:w+'px',height:h+'px',transform:'scale('+scale+')'});Object.assign(document.getElementById('shell').style,{width:w*scale+'px',height:h*scale+'px'});requestAnimationFrame(measure);};
frame.onload=()=>requestAnimationFrame(measure);
</script></html>
