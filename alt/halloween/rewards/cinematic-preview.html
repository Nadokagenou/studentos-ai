<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Cursed Ship · ห้องชมฉาก StudentOS</title><link rel="stylesheet" href="../season/cursed-ship.css"><link rel="stylesheet" href="../season/biome-finishes.css?rev=unique-20261026"><link rel="stylesheet" href="../season/cinematic-variants.css"><style>*{box-sizing:border-box}body{margin:0;background:#080b16;color:#eee6d6;font:16px/1.6 system-ui}main{min-height:100svh;display:flex;align-items:center;justify-content:center;gap:40px;padding:24px}.intro{max-width:300px}h1{font-size:32px;line-height:1.2;margin:10px 0}small{letter-spacing:.18em;color:#c6ac7b}p{color:#bcb9c7}button,a,select{font:inherit}select{display:block;width:100%;min-height:48px;margin:16px 0;padding:10px;border:1px solid #75684f;border-radius:10px;background:#151a28;color:#eee6d6}button{min-height:48px;padding:12px 24px;border:1px solid #e0ca97;border-radius:12px;background:#dac49a;color:#191723;cursor:pointer}a{color:#d5c195;display:block;margin-top:20px}.frame{width:300px;height:600px;flex:none}.phone{width:375px;height:750px;position:relative;overflow:hidden;transform:scale(.8);transform-origin:top left;border-radius:24px;border:1px solid #665a45;background:#101425;display:grid;place-items:center;text-align:center}.phone h2{font-size:23px;line-height:1.7}#status{min-height:50px;font-size:14px}@media(max-width:680px){main{display:block;padding:20px}.intro{margin:0 auto 20px}.frame{margin:auto}.intro h1{font-size:27px}.intro p{margin:8px 0}.intro a{margin-top:10px}}.frame.is-playing{position:fixed;inset:0;width:100vw!important;height:100svh!important;z-index:1000;background:#080b16}.frame.is-playing .phone{width:100vw;height:100svh;transform:none;border:0;border-radius:0}.frame.is-playing .phone>h2{opacity:0}</style></head><body><main><div class="intro"><small>STUDENTOS · HALLOWEEN</small><h1 id="sceneTitle">The Cursed Ship</h1><p>ฉากฉลองงานเสร็จในแต่ละไบโอม<br>6 วินาที · กดข้ามได้ตลอด</p><label>เลือกฉาก<select id="scenePick"><option value="cursedship">The Cursed Ship · ต้นแบบ</option></select></label><button id="play">เล่นฉาก</button><p id="status" role="status">กดเล่นเพื่อชมภาพเคลื่อนไหว<br>ดูตัวอย่างได้โดยไม่ต้องมีรางวัล</p><a href="../../">กลับเข้า StudentOS</a></div><div class="frame"><div class="phone"><h2>ทำเสร็จแล้ว<br>แบบฝึกหัดคณิตศาสตร์</h2></div></div></main>
<script>const nativeMedia=window.matchMedia.bind(window);let optedIn=false;window.matchMedia=q=>q.includes('prefers-reduced-motion')&&optedIn?{matches:false}:nativeMedia(q);window.FX_SHOP={};window.renderFxPick=()=>{};</script><script src="catalog.js"></script><script src="../season/biome-finishes.js?rev=unique-20261026"></script><script src="../season/cursed-ship.js?rev=secure-rewards-20261026"></script><script>
const play=document.getElementById('play'),status=document.getElementById('status'),pick=document.getElementById('scenePick'),title=document.getElementById('sceneTitle');
for(const item of StudentOSHalloweenRewards.items.filter(x=>x.kind==='effect')){const option=document.createElement('option');option.value=item.id;option.textContent=StudentOSHalloweenRewards.biomes[item.biome].name+' · '+item.name;pick.append(option);}
pick.onchange=()=>{const item=StudentOSHalloweenRewards.find(pick.value);title.textContent=item?.name||'The Cursed Ship';if(item)CursedShip.preloadVariant(item);};
new MutationObserver(records=>{if(records.some(r=>r.attributeName==='data-finish-stage')){const overlay=document.querySelector('.cs-ov');status.dataset.phase=overlay?.dataset.finishStage==='impact'?'impact':'finishing';status.textContent='กำลังรับงานด้วยพลังประจำรางวัล';}}).observe(document.querySelector('.phone'),{subtree:true,attributes:true,attributeFilter:['data-finish-stage']});
document.addEventListener('animationstart',event=>{if(event.animationName==='csSeal'){status.dataset.phase='seal';status.textContent='ประทับตราแล้ว · ฉากกำลังรับงาน';}});
play.onclick=()=>{status.dataset.phase='playing';optedIn=true;document.documentElement.dataset.csPreviewMotion='full';play.disabled=true;pick.disabled=true;document.querySelector('.frame').classList.add('is-playing');status.textContent='กำลังชมฉาก · แตะที่ฉากเพื่อข้าม';const done=()=>{status.dataset.phase='done';document.querySelector('.frame').classList.remove('is-playing');play.disabled=false;pick.disabled=false;status.textContent='จบฉากแล้ว · เลือกฉากอื่นหรือกดเล่นซ้ำได้';};const item=StudentOSHalloweenRewards.find(pick.value);if(item)CursedShip.playVariant(item,done,'แบบฝึกหัดคณิตศาสตร์ ข้อ 1–10',true);else CursedShip.playFx('แบบฝึกหัดคณิตศาสตร์ ข้อ 1–10',done,true);};CursedShip.preload();
</script></body></html>
