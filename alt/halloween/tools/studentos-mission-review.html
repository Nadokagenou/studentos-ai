<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจเควสมรณะ · ข้อมูลทดสอบ</title>
<style>body{font:16px/1.8 system-ui;max-width:700px;margin:40px auto;padding:20px;background:#eee7d1;color:#26382f}button,a{display:block;min-height:48px;margin:15px 0;padding:10px 16px;font:inherit}button{cursor:pointer}output{display:block;border:1px solid #8b9a84;padding:16px}</style>
<h1>เซฟทดสอบเควสมรณะ</h1><p>เฉพาะ localhost พอร์ต 4279 แยกจากข้อมูลผู้ใช้ บัญชีจริงปิดอยู่ หลักฐาน 20 นาทีด้านล่างเป็นข้อมูลจำลองสำหรับตรวจหน้ารับรางวัล</p>
<button data-fixture="empty" disabled>เตรียมเซฟใหม่กับงานธรรมดา 1 งาน</button><button data-fixture="ready" disabled>จำลองเควสครบ 20 นาทีและทำเสร็จ</button><button data-fixture="combat" disabled>เตรียมอาวุธสี่ชนิดและประตูแวมไพร์</button><output id="status">กำลังโหลดกติกา</output><a href="../event/?preview=1#tasks" target="_blank">เปิดสมุดเควสมรณะ</a><a href="../../?start=guest&go=tasks" target="_blank">เปิด StudentOS ทดสอบ</a>
<script src="../rewards/catalog.js"></script><script src="../rewards/ownership.js"></script><script src="../death-quests.js"></script><script src="../event/combat.js"></script><script src="../event/core.js"></script>
<script>
(async()=>{
const allowed=location.hostname==='127.0.0.1'&&location.port==='4279',out=document.getElementById('status');if(!allowed){out.textContent='ปิดเครื่องมือ: ใช้ได้เฉพาะเซฟทดสอบพอร์ต 4279';return;}
const Q=HalloweenDeathQuests,C=HalloweenEventCore,load=async n=>(await fetch('../event/data/'+n+'.json')).json(),config=C.build({materials:await load('materials'),chains:await Promise.all(['dutchman','jack','vampire','graveyard'].map(n=>load('quests.'+n))),catalog:StudentOSHalloweenRewards,proposals:await load('preview-rules'),preview:true}),key='studentos.alt.halloween.preview.v1';
document.querySelectorAll('[data-fixture]').forEach(b=>{b.disabled=false;b.addEventListener('click',()=>{
const now=Date.now(),kind=b.dataset.fixture;let event=Q.get(localStorage,key,null)||C.initial(config,'halloween-review-only',now,456789),state=Q.get(localStorage,'studentos.alt.v1',{tasks:[],sessions:[],settings:{}});
if(kind==='empty'){event=C.initial(config,'halloween-review-only',now,456789);state={tasks:[{id:'ordinary-fixture',subject:'คณิตศาสตร์',detail:'งานเดิมสำหรับตรวจว่าไม่หาย',type:'homework',createdAt:new Date(now).toISOString(),done:false,estMin:30}],sessions:[],settings:{name:'ผู้ทดสอบ'}};localStorage.setItem(Q.FOCUS_KEY,'{}');localStorage.setItem(Q.REQUEST_KEY,'[]');}
if(kind==='ready'){const q=Q.create(now-21*60000,'fixture-ready-0001',Q.owner(localStorage)),t=Q.task(q),parts=Q.split(state.tasks,state.sessions);t.done=true;t.doneAt=new Date(now-1000).toISOString();event.event.deathQuests={[q.day]:q};state.tasks=parts.tasks.concat(t);state.sessions=parts.sessions.concat({id:'fixture-20min',taskId:q.taskId,start:new Date(q.issuedAt).toISOString(),end:new Date(q.issuedAt+20*60000).toISOString(),min:20});localStorage.setItem(Q.FOCUS_KEY,JSON.stringify({[q.taskId]:{nonce:q.nonce,owner:q.owner,activeMs:20*60000,updatedAt:q.issuedAt+20*60000,lastCoveredAt:q.issuedAt+20*60000}}));}
if(kind==='combat'){for(const q of config.quests)event.event.quests[q.id]={complete:true};event.event.previewBiome='vampire-mansion';event.event.location={kind:'hub'};event.event.equipment='cruor-quill';for(const id of Object.keys(config.proposals.weapons))event.rewards[id]={id,permanent:true,receivedAt:now,receipt:'fixture-'+id};}
localStorage.setItem('studentos.alt.v1',JSON.stringify(state));localStorage.setItem(key,JSON.stringify(event));out.textContent='บันทึกข้อมูลจำลองแล้ว: '+kind+' · เปิดหรือรีเฟรชหน้าทดสอบเพื่อดูผล';
});});out.textContent='พร้อม · ทุกปุ่มเขียนเฉพาะข้อมูลทดสอบพอร์ต 4279';
const check=document.createElement('button');check.textContent='ตรวจข้อมูลทดสอบปัจจุบัน';check.onclick=()=>{const s=Q.get(localStorage,'studentos.alt.v1',{});out.textContent=JSON.stringify({owner:Q.owner(localStorage),tasks:s.tasks?.map(t=>({id:t.id,quest:t.halloweenDeathQuest,valid:Q.isLocal(t),done:t.done})),focus:Q.get(localStorage,Q.FOCUS_KEY,{})});};out.after(check);
})();
</script></html>
