<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบจำลองบัญชี · ตราโปรไฟล์</title>
<link rel="stylesheet" href="../../rewards/badges.css"><link rel="stylesheet" href="../../rewards/featured-badge.css">
<style>:root{--ink:#eee3f1;--muted:#b8a5c2;--line:#54425e;--card:#221c2c;--card2:#30263a;--blue:#d8b8e9;color-scheme:dark;font:14px system-ui}*{box-sizing:border-box}body{margin:0;background:#100d19}.phone{position:relative;min-height:100vh;width:min(100%,480px);margin:auto;padding:22px}header{padding:14px;background:#302535;border:1px dashed #9a789e;border-radius:13px;line-height:1.6}header small{display:block;color:#cdb8d2}nav{display:flex;gap:7px;margin:15px 0}nav button{min-height:44px;flex:1;background:#3a2d45;color:#eee0f3;border:1px solid #7a5d88;border-radius:10px}section article{padding:20px;margin:14px 0;border:1px solid var(--line);border-radius:15px;background:var(--card)}h2{font-size:18px}.who{color:#cfb3dd}.screen{display:block}</style>
<div class="phone"><header><b>แบบจำลองบัญชี · ทดสอบ UI</b><small>ข้อมูลสมมติในหน่วยความจำ ไม่เชื่อมบัญชีหรือบริการจริง</small></header><nav><button onclick="switchActor('a')">บัญชี A</button><button onclick="switchActor('b')">บัญชี B</button><button onclick="switchActor('guest')">ออกจากระบบ</button></nav><section class="screen on" id="qa-screen"><div id="pfHead"></div><div id="qaFriend"></div></section></div>
<script src="../../rewards/catalog.js"></script>
<script>
 const actors={a:'00000000-0000-4000-8000-000000000001',b:'00000000-0000-4000-8000-000000000002'},selected=new Map();
 var currentUser={id:actors.a};
 const items=()=>StudentOSHalloweenRewards.items.filter(x=>x.kind==='badge').map(x=>({...x,owned:!!currentUser&&(currentUser.id===actors.a||x.id==='crown-of-midnight')}));
 window.HalloweenBadges={viewOwn:()=>({status:currentUser?'ready':'login',entries:items()}),refreshOwn:async()=>{}};
 var sb={functions:{async invoke(_name,{body}){const who=currentUser?.id;if(!who)return {error:true};if(body.action==='equip'){if(body.badgeId&&!items().some(x=>x.id===body.badgeId&&x.owned))return {error:true};selected.set(who,body.badgeId?{user_id:who,season:'halloween-2026',badge_id:body.badgeId,earned_at:'2026-10-29T01:00:00Z',selected_at:'2026-10-30T01:00:00Z'}:null);}return {data:{selection:selected.get(who)||null}};}},from(){return {select(){return {async in(_key,users){return {data:users.map(id=>selected.get(id)).filter(Boolean)};}};}};}};
 function renderProfileHead(){const self=currentUser?currentUser.id===actors.a?'A':'B':'ผู้เยี่ยมชม';document.getElementById('pfHead').innerHTML='<article><small class="who">โปรไฟล์ของฉัน</small><h2>บัญชี '+self+'</h2>'+ (window.HalloweenFeaturedBadge?.html(currentUser?.id,{mine:true})||'')+'</article>';document.getElementById('qaFriend').innerHTML=currentUser?.id===actors.b?'<article><small class="who">เพื่อนที่รับแล้ว</small><h2>บัญชี A</h2>'+window.HalloweenFeaturedBadge.html(actors.a,{compact:true})+'</article>':'';}
 function switchActor(name){currentUser=actors[name]?{id:actors[name]}:null;renderProfileHead();}
 function showToast(){}function go(){}function setLoginView(){}
</script><script src="../../rewards/featured-badge.js"></script></html>
