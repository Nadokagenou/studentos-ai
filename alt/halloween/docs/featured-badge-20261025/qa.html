<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แบบจำลองบัญชี · ตราโปรไฟล์</title>

<script src="../../rewards/catalog.js"></script>
<script>
const BADGES = [
  { id: 'hello', tone: 'b1', mark: 'I', name: 'โอ้..สวัดดี!',

  { id: 'try', tone: 'b2', mark: 'C', name: 'ฉันพึ่งลองใช้ StudentOS',
    desc: 'เริ่มจับจังหวะของตัวเองได้แล้ว', goal: 10 },
  { id: 'hard', tone: 'b3', mark: 'M', name: 'การบ้านนี่มันลำบากจริง ๆ',
    desc: 'ผ่านมาหลายคืนกว่าจะถึงตรงนี้', goal: 25 },
  { id: 'nah', tone: 'b4', mark: 'V', name: 'คุณจะเลิกทำการบ้านไหม? Nah I\'d ทำการบ้าน',
    desc: 'ยืนยันคำตอบเดิมทุกครั้งที่ถูกถาม', goal: 75 },
  { id: 'unstoppable', tone: 'b5', mark: 'X', name: 'หยุดไม่ได้แล้ว!',
    desc: 'กลายเป็นนิสัยไปแล้วเรียบร้อย', goal: 100 },
  { id: 'deep', tone: 'sea', mark: '≡', name: 'Challenger Deep',

  { id: 'tree', tone: 'tree', mark: '✦', name: 'World Tree',
    desc: 'ยังมีลมพัดอยู่ตรงนั้นเสมอ', secret: 'earth' },

    desc: 'บางอย่างสวยเกินกว่าจะเป็นเรื่องบังเอิญ', secret: 'galaxy' },

    desc: 'จุดที่ทุกอย่างเริ่มต้นใหม่อีกครั้ง', genesis: true },

    skin: 'glitch', postGenesis: true },

 const actors={a:'00000000-0000-4000-8000-000000000001',b:'00000000-0000-4000-8000-000000000002'},selected=new Map();
 var currentUser={id:actors.a};
 const items=()=>StudentOSHalloweenRewards.items.filter(x=>x.kind==='badge').map(x=>({...x,owned:!!currentUser&&(currentUser.id===actors.a||x.id==='crown-of-midnight')}));
 window.HalloweenBadges={viewOwn:()=>({status:currentUser?'ready':'login',entries:items()}),refreshOwn:async()=>{}};
 var sb={functions:{async invoke(_name,{body}){const who=currentUser?.id;if(!who)return {error:true};if(body.action==='equip'){if(body.badgeId&&!([... (who===actors.a?BADGES.map(b=>b.id):['hello']),...items().filter(x=>x.owned).map(x=>x.id)]).includes(body.badgeId))return {error:true};selected.set(who,body.badgeId?{user_id:who,season:BADGES.some(b=>b.id===body.badgeId)?'studentos':'halloween-2026',badge_id:body.badgeId,earned_at:BADGES.some(b=>b.id===body.badgeId)?null:'2026-10-29T01:00:00Z',selected_at:'2026-10-30T01:00:00Z'}:null);}return {data:{selection:selected.get(who)||null,available:[...(who===actors.a?BADGES.map(b=>b.id):['hello']),...items().filter(x=>x.owned).map(x=>x.id)]}};}},from(){return {select(){return {async in(_key,users){return {data:users.map(id=>selected.get(id)).filter(Boolean)};}};}};}};
 function renderProfileHead(){const self=currentUser?currentUser.id===actors.a?'A':'B':'ผู้เยี่ยมชม';document.getElementById('pfHead').innerHTML='<article><small class="who">โปรไฟล์ของฉัน</small><h2>บัญชี '+self+'</h2>'+ (window.HalloweenFeaturedBadge?.html(currentUser?.id,{mine:true})||'')+'</article>';document.getElementById('qaFriend').innerHTML=currentUser?.id===actors.b?'<article><small class="who">เพื่อนที่รับแล้ว</small><h2>บัญชี A</h2>'+window.HalloweenFeaturedBadge.html(actors.a,{compact:true})+'</article>':'';}
 function switchActor(name){currentUser=actors[name]?{id:actors[name]}:null;renderProfileHead();}
 function showToast(){}function go(){}function setLoginView(){}
</script><script src="../../rewards/featured-badge.js"></script></html>
