# ============================================================
# Supabase — ตั้งค่าโปรเจกต์ (ใช้ตอน deploy ด้วย CLI)
# ============================================================
project_id = "yunbytxtgghizrdqftvj"

# ---------- Edge Functions ----------
# verify_jwt = false สำคัญมาก และไม่ได้แปลว่าไม่ปลอดภัย:
#   ปกติ Supabase บังคับให้ทุกคำขอแนบ JWT ของผู้ใช้มาด้วย
#   แต่ LINE เป็นคนยิง webhook มา มันไม่มีทางรู้จัก JWT ของเรา —
#   ถ้าเปิดไว้ LINE จะโดน 401 ทุกครั้งแล้ว webhook เงียบไปเฉย ๆ โดยไม่มีใครรู้
#
# ด่านความปลอดภัยจริงของ webhook คือลายเซ็น HMAC ที่ LINE เซ็นมากับ body
# แล้วเราตรวจด้วย LINE_CHANNEL_SECRET ในไฟล์ index.ts — ใครไม่มี secret ก็ปลอมไม่ได้
[functions.line-webhook]
verify_jwt = false

# ตัวนี้ยิงจาก cron ของ Supabase เอง จึงแนบ JWT ได้ตามปกติ
[functions.send-reminders]
verify_jwt = true

# อ่านรูปด้วย AI บนเซิร์ฟเวอร์ — ยิงจากแอปโดยผู้ใช้ที่ล็อกอินแล้วเท่านั้น
# verify_jwt = true จงใจ ไม่ใช่ค่าปริยายที่ลืมแก้:
#   โควตาฟรีของผู้ให้บริการ OCR นับเป็นจำนวนภาพต่อเดือน ถ้าเปิดให้เรียกโดยไม่ต้องล็อกอิน
#   ใครก็ได้ที่เจอ URL นี้ยิงรัวจนโควตาหมดได้ภายในไม่กี่นาที แล้วผู้ใช้จริงก็ใช้ไม่ได้
#   การบังคับล็อกอินทำให้ผูกการใช้งานกับบัญชีได้ และปิดกั้นการยิงมั่วจากภายนอก
[functions.ocr-assist]
verify_jwt = true

# ตัวอ่านตารางเรียนถือกุญแจ Gemini อยู่ — ห้ามปิด verify_jwt เด็ดขาด
# ปิดเมื่อไหร่มันกลายเป็นพร็อกซีฟรีให้ใครก็ได้ยิง Gemini ด้วยโควตาของเรา
# แล้วจะรู้ตัวอีกทีตอนโควตาหมด ซึ่งตอนนั้นสายไปแล้ว
[functions.read-timetable]
verify_jwt = true
