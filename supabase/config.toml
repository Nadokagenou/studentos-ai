# ============================================================
# Supabase — ตั้งค่าโปรเจกต์ (ใช้ตอน deploy ด้วย CLI)
# ============================================================
project_id = "yunbytxtgghizrdqftvj"

# ---------- Edge Functions ----------
# verify_jwt = false สำคัญมาก และไม่ได้แปลว่าไม่ปลอดภัย:
#   ปกติ Supabase บังคับให้ทุกคำขอแนบ JWT ของผู้ใช้มาด้วย
#   แต่ LINE เป็นคนยิง webhook มา มันไม่มีทางรู้จัก JWT ของเรา —
#   ถ้าเปิดไว้ LINE จะโดน 401 ทุกครั้งแล้ว webhook เงียบไปเฉย ๆ โดยไม่มีใครรู้
#
# ด่านความปลอดภัยจริงของ webhook คือลายเซ็น HMAC ที่ LINE เซ็นมากับ body
# แล้วเราตรวจด้วย LINE_CHANNEL_SECRET ในไฟล์ index.ts — ใครไม่มี secret ก็ปลอมไม่ได้
[functions.line-webhook]
verify_jwt = false

# ตัวนี้ยิงจาก cron ของ Supabase เอง จึงแนบ JWT ได้ตามปกติ
[functions.send-reminders]
verify_jwt = true

# อ่านรูปด้วย AI บนเซิร์ฟเวอร์ — ยิงจากแอปโดยผู้ใช้ที่ล็อกอินแล้วเท่านั้น
# verify_jwt = true จงใจ ไม่ใช่ค่าปริยายที่ลืมแก้:
#   โควตาฟรีของผู้ให้บริการ OCR นับเป็นจำนวนภาพต่อเดือน ถ้าเปิดให้เรียกโดยไม่ต้องล็อกอิน
#   ใครก็ได้ที่เจอ URL นี้ยิงรัวจนโควตาหมดได้ภายในไม่กี่นาที แล้วผู้ใช้จริงก็ใช้ไม่ได้
#   การบังคับล็อกอินทำให้ผูกการใช้งานกับบัญชีได้ และปิดกั้นการยิงมั่วจากภายนอก
[functions.ocr-assist]
verify_jwt = true

# ตัวอ่านตารางเรียนถือกุญแจ Gemini อยู่ — ห้ามปิด verify_jwt เด็ดขาด
# ปิดเมื่อไหร่มันกลายเป็นพร็อกซีฟรีให้ใครก็ได้ยิง Gemini ด้วยโควตาของเรา
# แล้วจะรู้ตัวอีกทีตอนโควตาหมด ซึ่งตอนนั้นสายไปแล้ว
[functions.read-timetable]
verify_jwt = true

# น้องไซถือกุญแจ Gemini เหมือนกัน และเป็นตัวที่ถูกเรียกบ่อยที่สุดในสามตัว
# (อ่านตาราง/อ่านรูป เรียกครั้งเดียวจบ ส่วนแชทเรียกทุกข้อความ)
# กฎเดียวกันจึงยิ่งใช้กับตัวนี้: เปิดโดยไม่ต้องล็อกอิน = พร็อกซีฟรีให้คนนอกเผาโควตา
# ค่าปริยายของ CLI คือ true อยู่แล้ว แต่เขียนไว้ให้ชัด — ของที่สำคัญขนาดนี้
# ไม่ควรขึ้นอยู่กับว่าใครจำค่าปริยายได้หรือเปล่า
[functions.ask-sai]
verify_jwt = true

# ---------- ชั้นหัวข้อทั่วโลก ----------
# ตัวจับรูปใบงานให้เป็นหัวข้อ ถือกุญแจ Gemini เหมือนสามตัวข้างบน กฎเดียวกันเป๊ะ:
# เปิดโดยไม่ต้องล็อกอิน = พร็อกซีฟรีให้คนนอกเผาโควตาของเรา
# (ในตัวฟังก์ชันตรวจ JWT ซ้ำอีกชั้นด้วย เพราะชั้นเดียวคือชั้นที่ลืมแก้ได้)
[functions.topic-match]
verify_jwt = true

# ตัวแปลข้อความในเธรด ถือกุญแจเหมือนกัน และถูกเรียกบ่อยที่สุดในชุดนี้
# (เรียกทุกครั้งที่เปิดเธรดที่มีข้อความภาษาอื่น) — ยิ่งห้ามเปิดทิ้งไว้
[functions.translate]
verify_jwt = true

# น้องไซในเธรดหัวข้อ ยิงจาก cron ของ Supabase เอง จึงแนบ JWT ได้ตามปกติ
# (ตั้งนาฬิกาที่ migration 20260908090300_topic_cron.sql)
[functions.sai-topic]
verify_jwt = true

# ---------- ชั้นกรองเนื้อหา ----------
# ตัวกรองถือกุญแจ Gemini เหมือนตัวอื่นข้างบน แต่ของตัวนี้แรงกว่า เพราะหลัง Phase 1
# มันถือ GUARD_GEMINI_KEY ซึ่งเป็นถังแยกของชั้นความปลอดภัยโดยเฉพาะ
# เปิดโดยไม่ต้องล็อกอิน = ใครก็ได้เผาถังของ "ตัวกรอง" ให้แห้งได้ตรง ๆ
# โดยที่ฟีเจอร์อื่นยังทำงานปกติ จึงไม่มีใครสังเกตว่าด่านความปลอดภัยดับไปแล้ว
#
# ค่าปริยายของ CLI คือ true อยู่แล้ว **แต่ทุกตัวที่ถือกุญแจถูกปักหมุดไว้หมด
# ยกเว้นสองตัวนี้** ซึ่งเป็นสองตัวที่สำคัญที่สุด — ของที่สำคัญขนาดนี้ไม่ควรขึ้นอยู่กับ
# ว่าใครจำค่าปริยายได้หรือเปล่า หรือว่า CLI รุ่นหน้าจะเปลี่ยนค่าปริยายไหม
# guard ยังอ่าน uid จาก JWT ไปลง mod_log ด้วย — ปิด verify_jwt เมื่อไหร่
# บันทึกจะกลายเป็น "ไม่รู้ว่าใคร" ทั้งตาราง ซึ่งเอาไปทำอะไรต่อไม่ได้เลย
[functions.guard]
verify_jwt = true

# ยิงจาก cron ของ Supabase เอง จึงแนบ JWT ได้ตามปกติ (เหมือน sai-topic)
# ตั้งนาฬิกาที่ migration 20260912090000_mod_sweep.sql
[functions.guard-sweep]
verify_jwt = true
