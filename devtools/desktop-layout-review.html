<!doctype html>
<html lang="th"><meta charset="utf-8"><title>StudentOS responsive layout review</title>
<style>body{margin:0;background:#ddd;font:14px system-ui}header{padding:10px;display:flex;gap:10px;align-items:center}button{padding:9px}iframe{display:block;border:0;background:white}output{position:fixed;top:65px;right:12px;background:#fffd;max-height:580px;overflow:auto;padding:10px;z-index:1;white-space:pre-wrap;font:12px monospace}output:empty{display:none}main{overflow:auto}</style>
<header><b>Local sample data</b><button data-width="375" data-height="812">375 × 812</button><button data-width="960" data-height="812">960 × 812</button><button data-width="1024" data-height="768">1024 × 768</button><button data-width="1440" data-height="900">1440 × 900</button><button id="measure">Measure DOM</button><button id="baseline">Baseline 375</button></header>
<output id="report"></output><main><iframe title="StudentOS test viewport" src="/?desktop-review=1" width="375" height="812"></iframe></main>
<script>
const frame=document.querySelector('iframe'),report=document.getElementById('report');
document.querySelectorAll('[data-width]').forEach(button=>button.onclick=()=>{frame.width=button.dataset.width;frame.height=button.dataset.height;});
document.getElementById('baseline').onclick=()=>{frame.width='375';frame.height='812';frame.src='/desktop-baseline.html';};
document.getElementById('measure').onclick=()=>{
 const doc=frame.contentDocument,view=frame.contentWindow,screen=doc.querySelector('.screen.on'),body=doc.querySelector('#menuBody');
 const rect=selector=>{const n=doc.querySelector(selector);return n?{...n.getBoundingClientRect().toJSON(),display:view.getComputedStyle(n).display}:null;};
 report.textContent=JSON.stringify({viewport:[view.innerWidth,view.innerHeight],desktop:view.matchMedia('(min-width:1024px)').matches,screen:screen?.id,horizontalOverflow:doc.documentElement.scrollWidth>view.innerWidth,homeScroll:body?{height:body.clientHeight,scroll:body.scrollHeight}:null,screenScroll:screen?{height:screen.clientHeight,scroll:screen.scrollHeight,overflowY:view.getComputedStyle(screen).overflowY}:null,phone:rect('.phone'),start:rect('.td-now .tn-cta'),tools:rect('.td-tiles'),tabbar:rect('.tabbar')},null,2);
};
</script></html>
