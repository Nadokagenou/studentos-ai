<!doctype html><html lang="th"><meta charset="utf-8"><title>StudentOS · เทียบหน้าหลักกับ ALT</title><style>body{margin:0;background:#0b0e19;color:#f1e7d6;font:15px system-ui}header{padding:14px;position:sticky;top:0;background:#101424;z-index:2}button,select{font:inherit;padding:9px;margin:3px;border-radius:9px;border:1px solid #80738f;background:#251d35;color:inherit}main{display:flex;justify-content:center;gap:18px;align-items:flex-start;padding:18px}.shell{flex:none;width:234px;height:550px}iframe{width:375px;height:812px;transform:scale(.62);transform-origin:top left;border:1px solid #665970;border-radius:18px;display:block}h2{font-size:18px}pre{font-size:12px;white-space:pre-wrap;max-width:900px;padding:18px;margin:auto}footer{padding:12px;text-align:center}body.boot-view .shell{position:relative}body.boot-view iframe{height:812px}</style><header><b>StudentOS · หน้าหลักเทียบ ALT</b><small> · ข้อมูลตัวอย่างในหน่วยความจำ ไม่เชื่อมบัญชีจริง</small><br><select id="size"><option value="375,812">375 × 812</option><option value="320,568">320 × 568</option><option value="768,1024">768 × 1024</option><option value="1280,900">1280 × 900</option></select><button data-screen="scr-menu">หน้าแรก</button><button data-screen="scr-tasks">งาน</button><button data-screen="scr-profile">ฉัน</button><button data-screen="scr-login">ล็อกอิน</button><button data-screen="scr-badges">เหรียญตรา</button><button data-screen="scr-events">อีเวนต์</button><button id="themes">เลือกธีม</button><select id="palette"><option value="dark">มืด</option><option value="halloween">Halloween</option><option value="moonlight">Moon &amp; Candle</option><option value="thai-ghost">เรือนลับแล</option><option value="hw-ghostship">เรือผี</option><option value="hw-vampire">ปราสาทแวมไพร์</option></select><button id="ship">ลองฉากเรือ</button><button id="measure">วัดหน้าจอ</button></header><main><section class="shell"><h2>เวอร์ชันหลัก /studentos-ai/</h2><iframe id="main" title="เวอร์ชันหลัก" src="../?halloween-showroom=1"></iframe></section><section class="shell"><h2>ALT อ้างอิง</h2><iframe id="alt" title="เวอร์ชัน ALT" src="../alt/?halloween-showroom=1"></iframe></section></main><pre id="report">กำลังโหลดทั้งสองหน้า…</pre><footer>เปรียบเทียบหน้าจอจริงสองเวอร์ชัน · ไม่แก้ข้อมูลผู้เล่น</footer><script>
window.__STUDENTOS_HALLOWEEN_COLLECTION__=true;
const frames=[document.getElementById('main'),document.getElementById('alt')],out=document.getElementById('report');
function measure(){out.textContent=JSON.stringify(frames.map(f=>{const d=f.contentDocument,s=d.querySelector('.screen.on'),r=s?.getBoundingClientRect();return {page:f.id,size:[f.clientWidth,f.clientHeight],screen:s?.id,theme:d.documentElement.dataset.theme,halloween:d.documentElement.classList.contains('hw-season'),overflow:d.documentElement.scrollWidth>f.clientWidth,menuScroll:s?.scrollHeight-s?.clientHeight,blocks:[...(d.getElementById('menuBody')?.children||[])].map(x=>({class:x.className,h:Math.round(x.getBoundingClientRect().height)})),broken:[...d.images].filter(x=>x.getAttribute('src')&&x.complete&&x.naturalWidth===0).map(x=>x.getAttribute('src')),boot:!!d.querySelector('#boot'),rewardThemeButtons:d.querySelectorAll('#themePick [data-th]').length,visibleText:s?.innerText.slice(0,650)};}),null,2);}
document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{frames.forEach(f=>{f.contentWindow.go(b.dataset.screen);if(b.dataset.screen==='scr-events')f.contentWindow.renderEvents();});setTimeout(measure,400);});
document.getElementById('themes').onclick=()=>{frames.forEach(f=>{f.contentWindow.openSetOpt('theme');});setTimeout(measure,400);};
document.getElementById('measure').onclick=measure;
document.getElementById('size').onchange=e=>{const[w,h]=e.target.value.split(',');const scale=+w>=1000?.38:+w>=600?.45:.62;frames.forEach(f=>{Object.assign(f.style,{width:w+'px',height:h+'px',transform:'scale('+scale+')'});Object.assign(f.parentElement.style,{width:(w*scale)+'px',height:(h*scale+40)+'px'});});setTimeout(measure,500);};

document.getElementById('palette').onchange=e=>{frames.forEach(f=>{f.contentWindow.setTheme(e.target.value);f.contentWindow.go('scr-menu');});setTimeout(measure,500);};
document.getElementById('ship').onclick=()=>{frames.forEach(f=>{const c=f.contentWindow.CursedShip;if(c){c.setMotionPreference('full');c.playFx('แบบฝึกหัดคณิตศาสตร์ ข้อ 1–10',()=>{},true);}});setTimeout(measure,500);};
async function seedEvent(f){const w=f.contentWindow,c=w.StudentOSHalloweenRewards;if(!c||!w.renderMenu)return;const cfg=await fetch('../alt/halloween/event/config.json').then(r=>r.json()),base=new URL('../alt/halloween/event/',location.href),ab=new URL('../rewards/',base),url=new URL(base);url.searchParams.set('preview','1');if(f.id==='main')url.searchParams.set('entry','main');
const card=cfg.card||{};w.HalloweenEventEntry=Object.freeze({name:cfg.name,tagline:cfg.tagline,blurb:cfg.blurb,href:url.href,preview:false,art:new URL(card.art,base).href,cast:(card.cast||[]).map(x=>new URL(x,base).href),names:card.names||[],fullNames:card.fullNames||[],slides:(cfg.slides||[]).map(x=>({...x,art:new URL(x.art,base).href})),sections:cfg.sections||[],rewards:c.items.filter(x=>x.rarity!=='Secret').map(x=>({id:x.id,name:x.name,kind:x.kind,rarity:x.rarity,color:c.biomes[x.biome].color,art:new URL(x.asset||'assets/'+x.id+'.svg',ab).href})),secretRewards:c.items.filter(x=>x.rarity==='Secret').length,countdown:()=> 'เหลือ '+Math.ceil((Date.parse(cfg.endsAt)-Date.now())/86400000)+' วัน',candy:()=>null});w.renderMenu();}
frames.forEach(f=>f.onload=async()=>{try{await seedEvent(f);}catch(e){out.textContent=e.message;}setTimeout(measure,1600);});

</script></html>
