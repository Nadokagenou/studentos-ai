<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d16">
  <title>FROSTBOUND v4.2 | Combat Reforged</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="interface.css">
</head>
<body>
  <main class="shell">
    <section class="stage" id="stage" aria-label="Frostbound game">
      <section class="title-screen" id="title-screen">
        <div class="front-snow snow" aria-hidden="true"></div>
        <div class="hero-copy">
          <p class="eyebrow"><span></span> Combat Reforged · v4.2</p>
          <h1>Frostbound</h1>
          <p class="motto">Master the Frost. Win by Skill.</p>
          <div class="title-actions">
            <button class="button primary" id="start">New Run <span aria-hidden="true">→</span></button>
            <button class="button secondary" id="modes">Game Modes</button>
            <button class="button secondary" id="training">Training</button>
            <button class="button secondary" id="records">Records</button>
            <button class="button secondary title-settings" id="options"><span aria-hidden="true">⚙</span> Settings</button>
            <button class="button secondary" id="credits">Credits</button>
          </div>
          <p class="best">Best score <strong id="best">—</strong></p>
        </div>
      </section>
      <section class="intro" id="intro" role="dialog" aria-modal="true" aria-label="The Frozen Keep prologue" aria-describedby="intro-description" hidden>
        <p class="sr-only" id="intro-description"></p>
        <div class="intro-scene intro-keep" aria-hidden="true">
          <div class="intro-art"></div>
          <div class="intro-caption"><h2>Frostbound</h2><p></p></div>
        </div>
        <div class="intro-scene intro-wanderer" aria-hidden="true">
          <div class="intro-art"></div>
          <div class="intro-caption"><p></p></div>
        </div>
        <div class="intro-scene intro-gate" aria-hidden="true">
          <div class="intro-art"></div>
          <div class="intro-caption"><p></p></div>
        </div>
        <div class="intro-snow snow" aria-hidden="true"></div>
        <button class="small-button intro-skip" id="skip-intro">Skip intro <kbd aria-hidden="true">Esc</kbd></button>
      </section>
      <section class="playfield" id="playfield" hidden>
        <canvas id="arena" aria-label="Frostbound combat arena" tabindex="-1"></canvas>
        <div class="hud">
          <div class="vitals">
            <div class="portrait" aria-hidden="true">✦</div>
            <div class="meters">
              <div class="meter-label"><span>HP</span><span id="health-text">100 / 100</span></div>
              <div class="meter hp" aria-label="Health"><i id="health"></i></div>
              <div class="stamina-line"><span>STA</span><div class="meter stamina" aria-label="Stamina"><i id="stamina"></i></div></div>
            </div>
          </div>
          <div class="encounter">
            <p id="wave">Room 1 / 5</p>
            <strong id="room-name"></strong>
            <span id="region-hud" hidden></span>
            <span id="remaining">3 foes remaining</span>
          </div>
          <div class="hud-actions"><span id="crowns" class="hud-crowns" aria-label="Frost Crowns"></span>
            <button class="pause-button" id="pause" aria-label="Pause game"><span aria-hidden="true">Ⅱ</span><span class="pause-label">Pause</span></button></div>
        </div>
        <div id="boss-hud" class="boss-hud" hidden>
          <div class="meter-label"><span id="boss-name">The Frozen King</span><span id="phase">Phase I</span></div>
          <div class="meter hp"><i id="boss-health"></i></div>
          <div id="posture-line" class="stamina-line" hidden><span>Posture</span><div class="meter posture"><i id="boss-posture"></i></div></div>
        </div>
        <div class="announcement" id="announcement" aria-hidden="true"></div>
        <div id="subtitle" class="subtitle" hidden></div>
        <div id="combat-notice" class="combat-notice" role="status" hidden></div>
        <div id="toast" class="hud-toast" role="status" hidden></div>
        <div id="safe-status" class="safe-status" hidden></div>
        <button id="interact" class="small-button interact" hidden></button>
        <div class="gate-guide" id="gate-guide" hidden><span aria-hidden="true">↑</span> North gate open</div>
        <div class="lesson" id="lesson" hidden>
          <strong id="lesson-title"></strong>
          <span id="lesson-body"></span>
          <button class="text-button" id="skip-lesson">Skip step</button>
        </div>
        <div class="loadout-hud" id="loadout-hud"><span id="weapon-icon" aria-hidden="true"></span><span id="weapon-name"></span></div>
        <div class="belt" id="belt"><span id="cooldowns" class="cooldowns"></span>
          <button id="inventory" class="small-button" hidden>Inventory <kbd>I</kbd></button>
          <button id="skill" class="small-button" disabled><span id="skill-label">No skill</span> <kbd>E</kbd></button>
          <button id="drink" class="small-button"><span id="potion-label"></span> <span class="potion-word">Potion</span> <kbd>R</kbd></button></div>
        <div class="touch" id="touch">
          <div class="stick" id="stick" aria-label="Movement joystick"><div id="knob"></div></div>
          <div class="touch-actions">
            <button data-action="heavy" aria-label="Heavy attack">Heavy</button>
            <button data-action="dash">Dash</button>
            <button data-action="parry">Parry</button>
            <button data-action="light" class="touch-attack" aria-label="Light attack">Strike</button>
          </div>
        </div>
      </section>
      <div class="veil" id="veil" hidden>
        <section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1"></section>
      </div>
    </section>
    <p id="live" class="sr-only" aria-live="polite"></p>
    <pre id="diagnostics" aria-label="Debug diagnostics" hidden></pre>
  </main>
  <script src="items.js"></script>
  <script src="loot.js"></script>
  <script src="build.js"></script>
  <script src="world.js"></script>
  <script src="events.js"></script>
  <script src="enemy-ai.js"></script>
  <script src="mutations.js"></script>
  <script src="boss-ai.js"></script>
  <script src="mini-bosses.js"></script>
  <script src="environment.js"></script>
  <script src="regions.js"></script>
  <script src="records.js"></script>
  <script src="combat.js"></script>
  <script src="animation.js"></script>
  <script src="weapon-animation.js"></script>
  <script src="enemy-animation.js"></script>
  <script src="feedback.js"></script>
  <script src="combat-audio.js"></script>
  <script src="render.js"></script>
  <script src="run-ui.js"></script>
  <script src="stability.js"></script>
  <script src="main.js"></script>
</body>
</html>
